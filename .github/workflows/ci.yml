name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  in-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test in-cli
        run: cargo test
        working-directory: in-cli

  rust-driver-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test hybrid-cli package
        run: cargo test -p hybrid-cli
        working-directory: compiler/rust-driver

  native-subset-sample:
    name: Native subset sample (no swiftc)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: IN_NATIVE_SWIFT_SIL=only in build
        run: ./scripts/check-native-subset-sample.sh

  in-lang-sample:
    name: In-lang sample (no swiftc)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: in build (.in v0 sample)
        run: ./scripts/check-in-lang-sample.sh

  in-lang-sample:
    name: .in sample (no swiftc)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: in build --parser in hello.in
        run: ./scripts/check-in-lang-sample.sh
