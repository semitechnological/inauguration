name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # ── Rust crate quality gates ──────────────────────────────────────
  in-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --check
        working-directory: in-cli
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
        working-directory: in-cli
      - name: Test
        run: cargo test --features extended
        working-directory: in-cli

  rust-driver-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --check --all
        working-directory: compiler/rust-driver
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        working-directory: compiler/rust-driver
      - name: Test hybrid-cli
        run: cargo test -p hybrid-cli
        working-directory: compiler/rust-driver

  # ── Protocol model generation ─────────────────────────────────────
  protocol-models:
    name: Protocol models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build protocol-gen
        run: cargo build --bin protocol-gen
        working-directory: in-cli
      - name: Add to PATH
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"
        working-directory: in-cli
      - name: Check generated models
        run: ./scripts/check-protocol-models.sh

  # ── Polyglot language samples (Tree-sitter frontends) ─────────────
  polyglot-samples:
    name: Polyglot samples
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install rust-src (for sysroot)
        run: rustup component add rust-src
      - name: Build in binary
        run: cargo build --release --bin in --features extended
        working-directory: in-cli
      - name: Add to PATH
        run: echo "$PWD/in-cli/target/release" >> "$GITHUB_PATH"
      - name: in build (.in sample)
        run: ./scripts/check-in-lang-sample.sh
      - name: in build (.icore sample)
        run: ./scripts/check-icore-sample.sh
      - name: in build (Swift sample)
        run: ./scripts/check-native-subset-sample.sh

  # ── JIT conformance (54/54) ───────────────────────────────────────
  jit-conformance:
    name: JIT conformance
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install rust-src
        run: rustup component add rust-src
      - name: Build in binary
        run: cargo build --release --bin in --features extended
        working-directory: in-cli
      - name: Add to PATH
        run: echo "$PWD/in-cli/target/release" >> "$GITHUB_PATH"
      - name: Run conformance suite
        run: ./scripts/run-conformance.sh

  # ── Self-hosting: compile compiler with itself ────────────────────
  self-host:
    name: Self-host
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install rust-src
        run: rustup component add rust-src
      - name: Build in binary
        run: cargo build --release --bin in --features extended
        working-directory: in-cli
      - name: Add to PATH
        run: echo "$PWD/in-cli/target/release" >> "$GITHUB_PATH"
      - name: Self-host compile
        run: |
          echo "=== Self-host: compile in-cli/src/main.rs ==="
          in build --path in-cli/src/main.rs --module-id InCli --verbose
          echo "=== Self-host: compile in-cli/src/lib.rs ==="
          in build --path in-cli/src/lib.rs --module-id Inauguration --verbose
      - name: Check diff whitespace
        run: git diff --check

  # ── Hybrid library crates ────────────────────────────────────────
  hybrid-libs:
    name: Hybrid library crates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test hybrid crates
        run: cd compiler/rust-driver && cargo test -p hybrid-pipeline -p hybrid-sil -p hybrid-core -p hybrid-scheduler
