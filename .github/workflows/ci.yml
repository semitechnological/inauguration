name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  in-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format in-cli
        run: cargo fmt --check
        working-directory: in-cli
      - name: Clippy in-cli
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
        working-directory: in-cli
      - name: Test in-cli
        run: cargo test
        working-directory: in-cli

  rust-driver-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format rust-driver
        run: cargo fmt --check --all
        working-directory: compiler/rust-driver
      - name: Clippy rust-driver
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        working-directory: compiler/rust-driver
      - name: Test hybrid-cli package
        run: cargo test -p hybrid-cli
        working-directory: compiler/rust-driver

  protocol-models:
    name: Protocol models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build protocol generator
        run: cargo build --bin protocol-gen
        working-directory: in-cli
      - name: Add protocol generator to PATH
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"
        working-directory: in-cli
      - name: Check generated protocol models
        run: ./scripts/check-protocol-models.sh

  polyglot-swift-sample:
    name: Swift Tree-sitter sample
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build in binary
        run: cargo build --release --bin in
        working-directory: in-cli
      - name: Add in binary to PATH
        run: echo "$PWD/in-cli/target/release" >> "$GITHUB_PATH"
      - name: in build (.swift Tree-sitter sample)
        run: ./scripts/check-native-subset-sample.sh

  in-lang-sample:
    name: In-lang sample (no swiftc)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build in binary
        run: cargo build --release --bin in
        working-directory: in-cli
      - name: Add in binary to PATH
        run: echo "$PWD/in-cli/target/release" >> "$GITHUB_PATH"
      - name: in build (.in v0 sample)
        run: ./scripts/check-in-lang-sample.sh

  icore-sample:
    name: icore JSON sample (no swiftc)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build in binary
        run: cargo build --release --bin in
        working-directory: in-cli
      - name: Add in binary to PATH
        run: echo "$PWD/in-cli/target/release" >> "$GITHUB_PATH"
      - name: in build (.icore sample)
        run: ./scripts/check-icore-sample.sh

  in-test-linux:
    name: in test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IN_TEST_SKIP_SWIFT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build in binary
        run: cargo build --release --bin in
        working-directory: in-cli
      - name: Add in binary to PATH
        run: echo "$PWD/in-cli/target/release" >> "$GITHUB_PATH"
      - name: Run in test
        run: command in test

  in-test-macos:
    name: in test (macos)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build in binary
        run: cargo build --release --bin in
        working-directory: in-cli
      - name: Add in binary to PATH
        run: echo "$PWD/in-cli/target/release" >> "$GITHUB_PATH"
      - name: Run in test
        run: command in test
      - name: Run in test owned-native
        env:
          IN_TEST_SKIP_SWIFT: "1"
        run: command in test --owned-native

  hybrid-libs:
    name: Hybrid library crates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test hybrid library crates
        run: cd compiler/rust-driver && cargo test -p hybrid-pipeline -p hybrid-sil -p hybrid-core -p hybrid-scheduler
