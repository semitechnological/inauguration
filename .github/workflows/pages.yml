name: Pages

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install crepuscularity CLI
        run: cargo install crepuscularity-cli --locked
      - name: Install wasm32 + wasm-bindgen-cli
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --locked --version 0.2.121
      - name: Build docs-site
        run: ./scripts/build-docs-site.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4