name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prerelease-gate:
    name: Prerelease gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            skip_swift: "1"
          - os: macos-latest
            skip_swift: "0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format in-cli
        run: cargo fmt --check
        working-directory: in-cli
      - name: Clippy in-cli
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
        working-directory: in-cli
      - name: Check generated protocol models
        run: cargo run --manifest-path in-cli/Cargo.toml --bin protocol-gen && git diff --exit-code -- in-cli/src/hotreload/generated_protocol.rs runtime/swift-preview-host/Sources/SwiftPreviewHost/GeneratedProtocol.swift
      - name: Build in binary
        run: cargo build --release --bin in --features extended
        working-directory: in-cli
      - name: Add in binary to PATH
        run: echo "$PWD/target/release" >> "$GITHUB_PATH"
        working-directory: in-cli
      - name: Run in test
        env:
          IN_TEST_SKIP_SWIFT: ${{ matrix.skip_swift }}
        run: in test
      - name: Run in test owned-native
        env:
          IN_TEST_SKIP_SWIFT: "1"
        run: in test --owned-native
      - name: Check diff whitespace
        run: git diff --check

  build:
    needs: prerelease-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: macos-aarch64
            binary_name: in
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
            binary_name: in
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build in-cli binary
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: in-cli
      - name: Package release tarball
        run: |
          mkdir -p dist
          cp "in-cli/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/${{ matrix.binary_name }}"
          tar -czf "dist/${{ matrix.binary_name }}-${{ matrix.asset_suffix }}.tar.gz" -C dist "${{ matrix.binary_name }}"
          shasum -a 256 "dist/${{ matrix.binary_name }}-${{ matrix.asset_suffix }}.tar.gz" > "dist/${{ matrix.binary_name }}-${{ matrix.asset_suffix }}.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_suffix }}
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
