[package]
name = "inauguration_docs_gen"
version = "0.1.0"
edition = "2021"
description = "Markdown → HTML for crepus [targets.docs] hook (docs-site)"

[[bin]]
name = "inauguration_docs_gen"
path = "src/main.rs"

[dependencies]
pulldown-cmark = "0.13"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
