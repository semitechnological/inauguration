[site]
name = "inauguration"
description = "Documentation site (crepus web build + crepuscularity-web)"
head_html = """
<link rel="icon" href="./static/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">
<style>
/* Layout & type: Vercel-adjacent light UI, Instrument Sans (see https://vercel.com/design/guidelines) */
.in-docs-page {
  --cp-bg: #ffffff;
  --cp-fg: #171717;
  --cp-muted: #666666;
  --cp-border: #eaeaea;
  --cp-elevated: #fafafa;
  --cp-code: #0a0a0a;
  --cp-accent: #0070f3;
  --cp-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.06);
  font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
  background-color: var(--cp-bg);
  color: var(--cp-fg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.in-docs-page code,
.in-docs-page pre,
.in-docs-page .font-mono {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
}
.crepus-t-text { color: var(--cp-fg); }
.crepus-t-muted { color: var(--cp-muted); }
.crepus-t-border { border-color: var(--cp-border) !important; }
.crepus-t-card {
  background-color: var(--cp-bg);
  border: 1px solid var(--cp-border);
  box-shadow: var(--cp-shadow);
}
.crepus-t-pre {
  background-color: var(--cp-elevated);
  color: var(--cp-fg);
  border: 1px solid var(--cp-border);
}
.crepus-t-btn-primary {
  background-color: var(--cp-fg);
  color: var(--cp-bg);
  border: 1px solid var(--cp-fg);
}
.crepus-t-btn-primary:hover { opacity: 0.92; }
.crepus-t-btn-ghost {
  border: 1px solid var(--cp-border);
  color: var(--cp-fg);
  background-color: var(--cp-bg);
}
.crepus-t-btn-ghost:hover { background-color: var(--cp-elevated); }
.crepus-t-icon { color: var(--cp-accent); }
.in-docs-page a:focus-visible {
  outline: 2px solid var(--cp-accent);
  outline-offset: 3px;
}
.in-docs-hero {
  border: 1px solid var(--cp-border);
  border-radius: 12px;
  background: linear-gradient(180deg, var(--cp-elevated) 0%, var(--cp-bg) 100%);
  box-shadow: var(--cp-shadow);
}
.in-docs-kicker {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--cp-muted);
}
.in-docs-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.35rem 0.65rem;
  border-radius: 999px;
  border: 1px solid var(--cp-border);
  background: var(--cp-bg);
  font-size: 0.8125rem;
  color: var(--cp-muted);
}
@media (prefers-reduced-motion: reduce) {
  .crepus-entrance { animation: none !important; }
}
@keyframes in-docs-fade-up {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
.crepus-entrance { animation: in-docs-fade-up 0.45s ease-out both; }
.crepus-e1 { animation-delay: 0.02s; }
.crepus-e2 { animation-delay: 0.06s; }
.crepus-e3 { animation-delay: 0.1s; }
.crepus-e4 { animation-delay: 0.14s; }
.crepus-e6 { animation-delay: 0.18s; }
</style>
"""
