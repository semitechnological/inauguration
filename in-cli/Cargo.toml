[workspace]
members = []
resolver = "2"

[package]
name = "inauguration"
version = "0.6.7"
edition = "2024"
license = "MPL-2.0"
description = ".in language and general compiler CLI (Core IR, hybrid SIL, staging, plugins)"
repository = "https://github.com/semitechnological/inauguration"
readme = "README.md"
keywords = ["compiler", "cli", "language", "core-ir"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "inauguration"
path = "src/lib.rs"

[[bin]]
name = "in"
path = "src/main.rs"

[[bin]]
name = "protocol-gen"
path = "src/bin/protocol_gen.rs"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha1 = "0.11"
sha2 = "0.11"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tree-sitter = "0.26.8"
# Core parsers (always included — most common languages)
tree-sitter-c = "0.24.2"
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = { version = "0.7.3", optional = true }
tree-sitter-typescript = "0.23.2"
tree-sitter-zig = { version = "1.1.2", optional = true }
# Extended parsers (opt-in via feature "extended")
tree-sitter-c-sharp = { version = "0.23.5", optional = true }
tree-sitter-dart = { version = "0.2.0", optional = true }
tree-sitter-elixir = { version = "0.3.5", optional = true }
tree-sitter-erlang = { version = "0.16.0", optional = true }
tree-sitter-fsharp = { version = "0.3.0", optional = true }
tree-sitter-groovy = { version = "0.1.2", optional = true }
tree-sitter-haskell = { version = "0.23.1", optional = true }
tree-sitter-holyc = { version = "0.0.1", optional = true }
tree-sitter-julia = { version = "0.23.1", optional = true }
tree-sitter-kotlin-ng = { version = "1.1.0", optional = true }
tree-sitter-lua = { version = "0.5.0", optional = true }
tree-sitter-objc = { version = "3.0.2", optional = true }
tree-sitter-ocaml = { version = "0.25.0", optional = true }
tree-sitter-perl = { version = "1.1.2", optional = true }
tree-sitter-php = { version = "0.24.2", optional = true }
tree-sitter-r = { version = "1.2.0", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-scala = { version = "0.26.0", optional = true }
tree-sitter-v = { version = "0.0.2", optional = true }
tree-sitter-language = "0.1.7"

[features]
default = []
extended = [
    "tree-sitter-cpp", "tree-sitter-swift", "tree-sitter-zig",
    "tree-sitter-c-sharp", "tree-sitter-dart", "tree-sitter-elixir",
    "tree-sitter-erlang", "tree-sitter-fsharp", "tree-sitter-groovy",
    "tree-sitter-haskell", "tree-sitter-holyc", "tree-sitter-julia",
    "tree-sitter-kotlin-ng", "tree-sitter-lua", "tree-sitter-objc",
    "tree-sitter-ocaml", "tree-sitter-perl", "tree-sitter-php",
    "tree-sitter-r", "tree-sitter-ruby", "tree-sitter-scala",
    "tree-sitter-v",
]

[target.'cfg(unix)'.dependencies]
libloading = "0.9"
notify = "8"

[build-dependencies]
which = "8"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "hybrid_sil"
harness = false

[profile.release]
lto = true
strip = true
codegen-units = 1

[[bench]]
name = "core_opt"
harness = false
