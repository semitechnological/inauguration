[package]
name = "inauguration"
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
description = ".in language and general compiler CLI (Core IR, hybrid SIL, staging, plugins)"
repository = "https://github.com/semitechnological/inauguration"
readme = "README.md"
keywords = ["compiler", "cli", "language", "core-ir"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "inauguration"
path = "src/lib.rs"

[[bin]]
name = "in"
path = "src/main.rs"

[[bin]]
name = "protocol-gen"
path = "src/bin/protocol_gen.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tree-sitter = "0.26.8"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-dart = "0.2.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-erlang = "0.16.0"
tree-sitter-fsharp = "0.3.0"
tree-sitter-go = "0.25.0"
tree-sitter-groovy = "0.1.2"
tree-sitter-haskell = "0.23.1"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-julia = "0.23.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-objc = "3.0.2"
tree-sitter-perl = "1.1.2"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-r = "1.2.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-zig = "1.1.2"

[target.'cfg(unix)'.dependencies]
notify = "8"

[build-dependencies]
which = "6"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "hybrid_sil"
harness = false
