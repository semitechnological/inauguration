[package]
name = "inauguration"
version = "0.1.1"
edition = "2024"
license = "MPL-2.0"
description = "Swift developer toolchain CLI (hybrid compiler pipeline, staging, plugins)"
repository = "https://github.com/semitechnological/inauguration"
readme = "README.md"
keywords = ["swift", "compiler", "cli", "toolchain"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "inauguration"
path = "src/lib.rs"

[[bin]]
name = "in"
path = "src/main.rs"

[[bin]]
name = "protocol-gen"
path = "src/bin/protocol_gen.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
notify = "8"
