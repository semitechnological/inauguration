[workspace]
members = []
resolver = "2"

[package]
name = "inauguration"
version = "0.7.7"
edition = "2024"
license = "MPL-2.0"
description = "Rust CLI for the inauguration Swift toolchain experiments: embedded hybrid pipeline (AST refresh → frontend → SIL analysis wave), hotreload daemon (Unix sockets), SwiftPM staging under .build/bin and .build/artifacts, plugins, and workspace-only integration commands (in test)."
repository = "https://github.com/tschk/inauguration"
readme = "README.md"
keywords = ["compiler", "cli", "language", "core-ir"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "inauguration"
path = "src/lib.rs"

[[bin]]
name = "in"
path = "src/main.rs"

[[bin]]
name = "protocol-gen"
path = "src/bin/protocol_gen.rs"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tree-sitter = "0.26.10"
# Tree-sitter parsers (all included by default for polyglot eval/build)
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.3"
tree-sitter-typescript = "0.23.2"
tree-sitter-zig = "1.1.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-dart = "0.2.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-erlang = "0.19.0"
tree-sitter-fsharp = "0.3.1"
tree-sitter-groovy = "0.1.2"
tree-sitter-haskell = "0.23.1"
tree-sitter-holyc = "0.1.1"
tree-sitter-julia = "0.23.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-objc = "3.0.2"
tree-sitter-ocaml = "0.25.0"
tree-sitter-perl = "1.1.2"
tree-sitter-php = "0.24.2"
tree-sitter-r = "1.2.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-scala = "0.26.0"
tree-sitter-v = "0.0.3"
[features]
default = []
v-native = []  # Build V native runtime (requires `v` compiler on PATH)
extended = []  # kept for compatibility; all parsers are now default

[target.'cfg(unix)'.dependencies]
libloading = "0.9"
notify = "8"

[build-dependencies]

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "hybrid_sil"
harness = false

[profile.release]
lto = true
strip = true
codegen-units = 1

[[bench]]
name = "core_opt"
harness = false

[[bench]]
name = "lower_core_closures"
harness = false

[[bench]]
name = "lower_core"
harness = false
