[package]
name = "inauguration"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[[bin]]
name = "in"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
hybrid-core = { path = "../compiler/rust-driver/crates/core" }
hybrid-pipeline = { path = "../compiler/rust-driver/crates/pipeline" }
hybrid-scheduler = { path = "../compiler/rust-driver/crates/scheduler" }
